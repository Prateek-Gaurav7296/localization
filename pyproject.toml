[project]
name = "ad-localization"
version = "0.1.0"
description = "Advertisement video localization pipeline: input split, STT/TTT/TTS, lip-sync, Streamlit UI."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["Ishnit"]  # external module; not linted or reformatted here

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is fine (tests, invariants)
    "S603",  # subprocess with argument lists is the intended, safe usage here
    "B008",  # FastAPI Depends/File in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
